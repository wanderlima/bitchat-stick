[platformio]
default_envs = m5stickc-plus2

[env:m5stickc-plus2]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 8MB
board_upload.maximum_size = 6291456
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    h2zero/NimBLE-Arduino@2.5.0
    https://github.com/LoupVaillant/Monocypher.git#0d85f98c9d9b0227e42cf795cb527dff372b40a4

; Temporary hardware check. Always reinstall m5stickc-plus2 after running it.
[env:settings-selftest]
extends = env:m5stickc-plus2
build_flags =
    ${env:m5stickc-plus2.build_flags}
    -DSTICK_SETTINGS_SELF_TEST
build_src_filter =
    +<Settings.cpp>
    +<hardware/SettingsSelfTest.cpp>
